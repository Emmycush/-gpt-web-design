<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book an Appointment | GPT Web Design</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef4ff;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #dbeafe;
    }

    .booking-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .brand-logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    .brand h2 {
      margin: 0;
      font-size: 20px;
      color: #0f172a;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #64748b;
    }

    .booking-container > h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #0f172a;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #334155;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      background: #f8fafc;
      color: #172033;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    small {
      display: block;
      margin-top: 6px;
      color: #64748b;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .booking-container {
        margin: 25px 15px;
        padding: 24px;
      }

      header {
        padding: 35px 15px;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Book an Appointment</h1>
    <p>Schedule your service quickly and easily</p>
  </header>

  <div class="booking-container">

    <div class="brand">
      <div class="brand-logo">G</div>

      <div>
        <h2>GPT Web Design</h2>
        <p>Professional Booking Solutions</p>
      </div>
    </div>

    <h2>Appointment Form</h2>

    <form id="bookingForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="service">Choose a Service</label>

      <select id="service" required>
        <option value="">Select a service</option>
        <option value="Haircut - $25">Haircut — $25</option>
        <option value="Hair Styling - $40">Hair Styling — $40</option>
        <option value="Hair Coloring - $60">Hair Coloring — $60</option>
        <option value="Toupee Installation - $80">
          Toupee Installation — $80
        </option>
        <option value="Other - Contact for Price">
          Other — Contact for Price
        </option>
      </select>

      <label for="date">Choose Date</label>
      <input type="date" id="date" required>

      <label for="time">Choose Time</label>
      <input type="time" id="time" required>

      <label for="notes">Additional Notes</label>

      <textarea
        id="notes"
        placeholder="Anything you want us to know?"
      ></textarea>

      <button type="submit">
        Book Appointment
      </button>

    </form>

    <a href="index.html" class="back">
      ← Back to Website
    </a>

  </div>

  <footer>
    © 2026 GPT Web Design
  </footer>

  <script>
    const form = document.getElementById("bookingForm");
    const dateInput = document.getElementById("date");

    // Prevent customers from selecting past dates
    const today = new Date();

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    dateInput.min = `${year}-${month}-${day}`;

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const service = document.getElementById("service").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const notes = document.getElementById("notes").value;

      const message =
        "📅 *New Appointment Request*%0A%0A" +
        "👤 Name: " + encodeURIComponent(name) + "%0A" +
        "📞 Phone: " + encodeURIComponent(phone) + "%0A" +
        "💇 Service: " + encodeURIComponent(service) + "%0A" +
        "📅 Date: " + encodeURIComponent(date) + "%0A" +
        "⏰ Time: " + encodeURIComponent(time) + "%0A" +
        "📝 Notes: " + encodeURIComponent(notes);

      const whatsappNumber = "2347045065523";

      const whatsappURL =
        "https://wa.me/" + whatsappNumber + "?text=" + message;

      const confirmation = document.createElement("div");

      confirmation.innerHTML = `
        <div style="
          text-align:center;
          padding:30px 15px;
        ">
          <div style="font-size:55px;">✅</div>

          <h2>Appointment Request Ready!</h2>

          <p>
            Thank you, <strong>${name}</strong>.
            Your appointment details are ready to send.
          </p>

          <p>
            <strong>${service}</strong><br>
            ${date} at ${time}
          </p>

          <button onclick="window.open('${whatsappURL}', '_blank')">
            📱 Send Booking via WhatsApp
          </button>

          <button
            onclick="location.reload()"
            style="background:#64748b;">
            Book Another Appointment
          </button>
        </div>
      `;

      form.parentNode.replaceChild(confirmation, form);
    });
  </script>

</body>
</html>
